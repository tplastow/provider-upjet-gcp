apiVersion: vertexai.gcp.m.upbound.io/v1beta1
kind: ReasoningEngine
metadata:
  annotations:
    meta.upbound.io/example-id: vertexai/v1beta1/reasoningengine
  labels:
    testing.upbound.io/example-name: reasoning_engine
  name: reasoning-engine
  namespace: upbound-system
spec:
  forProvider:
    displayName: reasoning-engine
    description: Deployed with BYOC and Agent Identity through Crossplane
    region: us-central1
    # Setting deletionPolicy to FORCE ensures that any child session resources created
    # during agent execution do not block resource deletion in GCP.
    deletionPolicy: FORCE
    spec:
      agentFramework: google-adk
      # AGENT_IDENTITY requires that serviceAccount is NOT set.
      identityType: AGENT_IDENTITY
      # class_methods is a JSON-encoded string in the API.
      classMethods: |-
        [
          {
            "api_mode": "async",
            "name": "async_create_session",
            "parameters": {
              "type": "object",
              "required": ["user_id"],
              "properties": {
                "user_id": {"type": "string"}
              }
            }
          },
          {
            "api_mode": "async",
            "name": "async_get_session",
            "parameters": {
              "type": "object",
              "required": ["user_id", "session_id"],
              "properties": {
                "user_id": {"type": "string"},
                "session_id": {"type": "string"}
              }
            }
          },
          {
            "api_mode": "async",
            "name": "async_list_sessions",
            "parameters": {
              "type": "object",
              "required": ["user_id"],
              "properties": {
                "user_id": {"type": "string"}
              }
            }
          },
          {
            "api_mode": "async",
            "name": "async_delete_session",
            "parameters": {
              "type": "object",
              "required": ["user_id", "session_id"],
              "properties": {
                "user_id": {"type": "string"},
                "session_id": {"type": "string"}
              }
            }
          },
          {
            "api_mode": "async_stream",
            "name": "async_stream_query",
            "parameters": {
              "type": "object",
              "required": ["user_id", "session_id", "message"],
              "properties": {
                "user_id": {"type": "string"},
                "session_id": {"type": "string"},
                "message": {"type": "string"}
              }
            }
          }
        ]
      # imageUri must reference an existing BYOC agent image in Artifact Registry.
      containerSpec:
        imageUri: us-central1-docker.pkg.dev/PROJECT_ID/vertex-byoc/byoc-agent:latest
      deploymentSpec:
        minInstances: 1
        maxInstances: 3
        containerConcurrency: 5
        resourceLimits:
          cpu: "4"
          memory: 4Gi
